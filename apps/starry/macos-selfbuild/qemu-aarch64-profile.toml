args = [
    "-nographic",
    "-accel",
    "tcg,thread=multi",
    "-machine",
    "virt,gic-version=3",
    "-cpu",
    "cortex-a53",
    "-m",
    "8192M",
    "-smp",
    "8",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-arceos-helloworld-profile.img",
]
uefi = false
to_bin = true
rootfs_write_policy = "persist"
shell_prefix = "root@starry:"
shell_init_cmd = "/bin/sh /opt/starry-macos-run.sh"
success_regex = ["(?m)^===STARRY-ARCEOS-HELLOWORLD-PROFILE-WINDOW-PASS elapsed=[0-9]+ rc=0 build_completed=true tg_xtask_reused=(true|false)===$"]
fail_regex = [
    "(?i)\\bpanicked at\\b",
    "(?i)\\bkernel panic\\b",
    "(?i)\\bunhandled trap\\b",
    "(?m)^===STARRY-ARCEOS-HELLOWORLD-PROFILE-FAIL",
]
# Full compilation has no deadline; only a completed binary is a success.
timeout = 0
