board_type = "OrangePi-5-Plus"
shell_prefix = "root@starry:/root #"
success_regex = [
  '(?m)^===STARRY-ORANGEPI5PLUS-SELFBUILD-PASS run=[A-Za-z0-9._-]+ jobs=[0-9]+ elapsed=[0-9]+===$',
]
fail_regex = [
  '(?m)^===STARRY-ORANGEPI5PLUS-SELFBUILD-FAIL(?: .*)?===$',
  '(?m)^===STARRY-ORANGEPI5PLUS-SELFBUILD-TIMEOUT===$',
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  '(?i)\bpanic(?:ked)?\b',
]
timeout = 10800
